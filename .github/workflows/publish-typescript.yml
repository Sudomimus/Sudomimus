name: Publish TypeScript SDKs

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "sdks/typescript/**"
      - "sdks/fixtures/**"
      - "examples/typescript/**"
      - "specs"
      - "scripts/operation/reserved-version.cjs"
      - "make/typescript-release.mk"
      - ".github/workflows/ci-typescript.yml"
      - ".github/workflows/publish-typescript.yml"

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci-typescript.yml
  release:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.select.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bash sdks/typescript/scripts/release/select-publish.sh
  publish:
    needs: [validate, release]
    if: github.ref == 'refs/heads/master' && needs.validate.result == 'success' && needs.release.outputs.publish == 'true'
    concurrency:
      group: publish-typescript
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: sdks/typescript/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: sdks/typescript/.nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:publish
