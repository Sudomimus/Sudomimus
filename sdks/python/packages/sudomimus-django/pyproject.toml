[project]
name = "sudomimus-django"
version = "0.1.0"
description = "Django integration for Sudomimus Connect browser login"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sudomimus Contributors" }]
dependencies = ["Django>=4.2", "sudomimus-connect==4.1.0", "sudomimus-session==4.1.0"]

[project.urls]
Homepage = "https://sudomimus.com"
Repository = "https://github.com/sudomimus/sudomimus"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sudomimus_django"]
