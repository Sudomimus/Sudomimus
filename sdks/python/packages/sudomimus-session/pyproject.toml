[project]
name = "sudomimus-session"
version = "4.0.0"
description = "Sudomimus Session SDK — user info, claim state, refresh-token rotation, introspection, logout, and session revocation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Sudomimus Contributors" },
]
dependencies = [
    "httpx>=0.27",
    "pydantic[email]>=2.7",
    "sudomimus-token==4.0.0",
]

[project.urls]
Homepage = "https://sudomimus.com"
Repository = "https://github.com/sudomimus/sudomimus"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sudomimus_session"]
